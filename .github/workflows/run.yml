name: Daily Task

on:
  schedule:
    # Runs at 7:00 AM IST (1:30 AM UTC)
    - cron: '30 1 * * *'

    # Also run at 9:00 AM IST (3:30 AM UTC) as backup
    - cron: '30 3 * * *'

  # Manual trigger button (for testing)
  workflow_dispatch:

jobs:
  run-task:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdbus-1-3 libdrm2 libgbm1 libgtk-3-0 libnspr4 libnss3 libxcomposite1 libxdamage1 libxfixes3 libxkbcommon0 libxrandr2

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Run task
        env:
          LINKEDIN_EMAIL: ${{ secrets.LINKEDIN_EMAIL }}
          LINKEDIN_PASSWORD: ${{ secrets.LINKEDIN_PASSWORD }}
          LINKEDIN_COOKIE: ${{ secrets.LINKEDIN_COOKIE }}
        run: python job_apply.py
