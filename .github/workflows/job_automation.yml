name: Job Application Automation

on:
  schedule:
    # Runs every 12 hours
    - cron: '0 */12 * * *'
  workflow_dispatch:
    # Allows manual triggering from the Actions tab

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r automation/requirements.txt
          playwright install chromium --with-deps

      - name: Run LinkedIn Bot
        env:
          LINKEDIN_EMAIL: ${{ secrets.LINKEDIN_EMAIL }}
          LINKEDIN_PASSWORD: ${{ secrets.LINKEDIN_PASSWORD }}
          LINKEDIN_COOKIE: ${{ secrets.LINKEDIN_COOKIE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python automation/linkedin_bot.py
        continue-on-error: true

      - name: Run Naukri Bot
        env:
          NAUKRI_SID: ${{ secrets.NAUKRI_SID }}
          NAUKRI_NKWAP: ${{ secrets.NAUKRI_NKWAP }}
        run: python automation/naukri_bot.py
        continue-on-error: true

      - name: Upload Artifacts (Screenshots & Logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-results
          path: |
            *.png
            *.log
          retention-days: 7
